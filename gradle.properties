# Gradle 自身：ForgeGradle 反编译 1.20.1 需要较大堆，3G 是 MDK 默认值。
# check.certs=false：ForgeGradle 在 apply 阶段会硬编码探测 https://maven.minecraftforge.net/ 与
# https://libraries.minecraft.net/，本机到前者直接超时，构建会在配置阶段就失败。
# 它只是个连通性自检，关掉不影响产物校验（userdev/mcp_config 走镜像的 HTTPS，并校验 SHA1）。
# 本机 TUN 代理会接受 TCP 连接却长期不回一个字节。ForgeGradle 用裸 HttpURLConnection 且不设超时，
# 于是一条坏连接就能让构建永久挂起（实测卡在 MinecraftRepo.findDownloadEntry 的 socket read 上）。
# org.gradle.internal.http.* 只作用于 Gradle 自己的传输层，管不到 ForgeGradle；
# 真正生效的是下面两个 JVM 级默认值：HttpURLConnection 在调用方未显式设超时时会读取它们。
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Dnet.minecraftforge.gradle.check.certs=false -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=120000
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

org.gradle.internal.http.socketTimeout=60000
org.gradle.internal.http.connectionTimeout=60000

# 固定用 JDK 17 跑构建（1.20.1 的字节码目标；系统 PATH 上的 java 是 21，会绕开 toolchain 探测）
org.gradle.java.home=D:/Program Files/Java/jdk-17

# 代理说明：本机 Clash 以 TUN/增强模式接管出网，Gradle 无需再设 HTTP 代理；
# 显式设 systemProp.*.proxyHost 反而会让 Forge Maven 的 CONNECT 隧道卡住。
# 慢速源统一改走 BMCLAPI 镜像，见 settings.gradle / build.gradle。

