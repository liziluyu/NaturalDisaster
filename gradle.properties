# Gradle daemon/parallel/caching settings. The NeoForm runtime artifacts are shared through
# ~/.gradle/caches/neoformruntime, so switching Minecraft versions does not re-download them.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment versions
# Latest NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.219
neo_version_range=[21,)
loader_version_range=[4,)

## Mod identity
mod_id=naturaldisaster
mod_name=Natural Disaster
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.fst.naturaldisaster
mod_authors=liujz
mod_description=Deterministic, simulation-free disaster centers: anchor grid + bounded home range + low-discrepancy spline roaming.
