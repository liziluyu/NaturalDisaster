modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 可选前置：Xaero 的世界地图。缺失时本模组照常加载；存在时地图相关集成才启用。
# 1.21.1 NeoForge 版为 1.47.0（libs/ 内的开发用 jar，兼容 MC [1.21,1.21.2) / NeoForge [21.0.110-beta,21.2.0)）。
[[dependencies."${mod_id}"]]
modId = "xaeroworldmap"
type = "optional"
versionRange = "[1.47.0,)"
ordering = "AFTER"
side = "BOTH"

# 可选前置：Cold Sweat。缺失时照常加载，加载状态供后续兼容逻辑查询。
[[dependencies."${mod_id}"]]
modId = "cold_sweat"
type = "optional"
versionRange = ""
ordering = "AFTER"
side = "BOTH"

# 客户端渲染注入：仅天气显示（LevelRenderer 雨雪判定），client 数组保证不在专用服务器应用。
[[mixins]]
config = "naturaldisaster.client.mixins.json"

# Loaded-only terrain access while a disaster effect is settling; no lifecycle injection.
[[mixins]]
config = "naturaldisaster.effects.mixins.json"
